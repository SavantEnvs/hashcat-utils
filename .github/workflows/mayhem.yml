# The Mayhem worker: build the commit image from mayhem/Dockerfile, push it to ghcr, then run
# Mayhem over each Mayhemfile. Runs on manual dispatch and is called by the sync cron
# (sync.yml) only when upstream actually moved — we fuzz on real upstream movement or an explicit
# dispatch, NOT on every commit to the mayhem branch.
# Duration is a dispatch/call input: 300s (5-min confirmation / `/check`), 1200s (weekly cron),
# or a longer deliberate deep run. Needs the MAYHEM_TOKEN secret.
name: Mayhem

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz seconds per target (default 300 = 5 min confirmation; e.g. 14400 = 4h deep run).'
        type: string
        required: false
        default: '300'
  workflow_call:
    inputs:
      ref:
        description: commit/branch to build (cron passes the freshly-rebased mayhem SHA)
        type: string
        required: false
        default: ''
      duration:
        description: fuzz seconds per target
        type: string
        required: false
        default: '1200'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build commit image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve build SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=commit-${{ steps.sha.outputs.sha }}

      - name: Build and push (mayhem/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mayhem/Dockerfile
          push: true
          build-args: |
            COMMIT=${{ steps.sha.outputs.sha }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      ref: ${{ steps.sha.outputs.sha }}

  mayhem:
    needs: build
    name: 'fuzz ${{ matrix.mayhemfile }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mayhemfile:
          - mayhem/Mayhemfile_cleanup-rules
          - mayhem/Mayhemfile_combinator
          - mayhem/Mayhemfile_combinator3
          - mayhem/Mayhemfile_combinatorX
          - mayhem/Mayhemfile_combipow
          - mayhem/Mayhemfile_ct3_to_ntlm
          - mayhem/Mayhemfile_cutb
          - mayhem/Mayhemfile_expander
          - mayhem/Mayhemfile_fuzz_rules
          - mayhem/Mayhemfile_gate
          - mayhem/Mayhemfile_generate-rules
          - mayhem/Mayhemfile_hcstat2gen
          - mayhem/Mayhemfile_hcstatgen
          - mayhem/Mayhemfile_keyspace
          - mayhem/Mayhemfile_len
          - mayhem/Mayhemfile_mli2
          - mayhem/Mayhemfile_morph
          - mayhem/Mayhemfile_ngramX
          - mayhem/Mayhemfile_permute
          - mayhem/Mayhemfile_permute_exist
          - mayhem/Mayhemfile_prepare
          - mayhem/Mayhemfile_req-exclude
          - mayhem/Mayhemfile_req-include
          - mayhem/Mayhemfile_rli
          - mayhem/Mayhemfile_rli2
          - mayhem/Mayhemfile_rules_optimize
          - mayhem/Mayhemfile_splitlen
          - mayhem/Mayhemfile_strip-bsn
          - mayhem/Mayhemfile_strip-bsr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.ref }}
      - name: Start analysis for ${{ matrix.mayhemfile }}
        uses: ForAllSecure/mcode-action@v1
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ needs.build.outputs.image }} --file ${{ matrix.mayhemfile }} --duration ${{ inputs.duration || '1200' }}

